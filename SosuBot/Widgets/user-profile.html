<style>
:root{--fg:var(--tg-theme-text-color);--mu:var(--tg-theme-hint-color);--ch:var(--tg-theme-secondary-bg-color);--on:var(--tg-theme-button-color);--of:var(--tg-theme-button-text-color);--ac:var(--tg-theme-accent-text-color)}
.hero{--fg:#fff;--mu:rgba(255,255,255,.72);--ch:rgba(255,255,255,.14);--on:#fff;--of:#111;--ac:#9fe0ff}
body{margin:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));color:var(--fg);font-variant-numeric:tabular-nums}
#bg{position:fixed;top:-16px;left:-16px;right:-16px;bottom:-16px;z-index:-1;background-position:center;background-size:cover}
.im{filter:blur(6px) brightness(.5)}
.h{display:flex;align-items:center;gap:10px}
.av{width:48px;height:48px;flex:none;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;background:var(--on);color:var(--of)}
.hero .av{box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.av img{width:100%;height:100%;object-fit:cover}
.nm{font-size:17px;font-weight:700}
.mu{color:var(--mu);font-size:13px}
.t{display:flex;gap:4px;margin:12px 0}
.t button,#o{margin:0;border:0;border-radius:8px;background:var(--ch);color:var(--fg)}
.t button{flex:1;padding:6px 0;font-size:13px}
.t .on{background:var(--on);color:var(--of)}
.big{display:flex;justify-content:space-between;align-items:flex-end}
.pp{font-size:28px;font-weight:800;line-height:1.1}
.rk{font-size:20px;font-weight:700;text-align:right}
.bar{height:4px;margin:10px 0 4px;border-radius:2px;background:var(--ch)}
.bar i{display:block;height:4px;border-radius:2px;background:var(--on)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:10px}
.g b{display:block;font-size:15px}
.gr{display:flex;gap:6px;margin:12px 0}
.gr span{flex:1;padding:4px 0;border-radius:8px;text-align:center;font-size:12px;background:var(--ch)}
.gr b{display:block;font-size:14px}
.x{color:#b8c4cf}.y{color:#f0b90b}.z{color:#5fd068}
.d{font-size:12px;color:var(--ac)}
#o{width:100%;margin-top:12px;padding:8px}
</style>
<div id="bg"></div>
<div class="h"><div class="av" id="av"></div><div><div class="nm" id="nm"></div><div class="mu" id="sb"></div></div></div>
<div class="t" id="t"></div>
<div id="b"></div>
<button id="o"></button>
<script>
const W=window.TelegramWidget,L=__L__,A='__AV__',B='__BG__',K='__AC__'.split(','),$=i=>document.getElementById(i);
let D=null;try{D=JSON.parse(W&&W.publicData)}catch(e){}
D=D||{n:'?',s:[]};
let m=D.m|0;
const N=(v,f)=>v==null?'—':Number(v).toLocaleString(navigator.language,{maximumFractionDigits:f|0});
const F=c=>c&&c.length==2?String.fromCodePoint(...[...c.toUpperCase()].map(x=>127397+x.charCodeAt(0))):'';
const C=(l,v,d)=>'<div><span class="mu">'+l+'</span><b>'+v+(d?' <span class="d">'+d+'</span>':'')+'</b></div>';
const G=(k,l,v)=>'<span><b class="'+k+'">'+l+'</b>'+N(v)+'</span>';
function tabs(){
$('t').replaceChildren(...['osu!','taiko','catch','mania'].map((t,i)=>{
const b=document.createElement('button');b.textContent=t;b.className=i==m?'on':'';b.disabled=!D.s[i];
b.onclick=()=>{if(m!=i){m=i;W&&W.HapticFeedback.selectionChanged();draw()}};return b}))}
function draw(){
tabs();
const s=D.s[m],d=m==D.m&&D.d||[];
if(!s){$('sb').textContent='';$('b').innerHTML='<p class="mu">—</p>';return}
const[gr,cr,pp,ac,pc,pt,lv,lp,ssh,ss,sh,sx,a,mc]=s;
$('sb').textContent='#'+N(gr)+' · '+F(D.c)+' #'+N(cr);
$('b').innerHTML='<div class="big"><div><div class="mu">pp</div><div class="pp">'+N(pp)+(d[0]?' <span class="d">'+d[0]+'</span>':'')+'</div></div>'
+'<div><div class="mu">'+L.rank+'</div><div class="rk">#'+N(gr)+'</div></div></div>'
+'<div class="bar"><i style="width:'+(lp|0)+'%"></i></div><div class="mu">lvl '+N(lv)+' · '+(lp|0)+'%</div>'
+'<div class="g">'+C(L.acc,N(ac,2)+'%',d[1])+C(L.pc,N(pc))+C(L.pt,N(pt)+' '+L.h,d[2])+C(L.mc,N(mc)+'x')+'</div>'
+'<div class="gr">'+G('x','SS',ssh)+G('y','SS',ss)+G('x','S',sh)+G('y','S',sx)+G('z','A',a)+'</div>'
+'<div class="mu">'+L.reg+': '+(D.r||'—')+' · '+L.ach+': '+(D.a||'—')+'</div>'}
if(A){const i=document.createElement('img');i.src=A;$('av').append(i)}else $('av').textContent=(D.n||'?')[0].toUpperCase();
if(B||K[1]){document.body.className='hero';const g=$('bg').style;
if(B){g.backgroundImage='url('+B+')';g.backgroundColor=K[1]||'#222';$('bg').className='im'}
else g.backgroundImage='linear-gradient(135deg,'+K[0]+','+K[1]+')'}
$('nm').textContent=D.n||'?';
$('o').textContent=L.open;
$('o').onclick=()=>{if(W&&D.i)W.openLink('https://osu.ppy.sh/users/'+D.i)};
if(W)W.onEvent('publicDataChanged',()=>{try{D=JSON.parse(W.publicData)||D}catch(e){}draw()});
draw();
</script>
