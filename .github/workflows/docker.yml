name: Docker CI

on:
  push:
    branches: [master]
    paths:
      - "**/*.cs"
      - "**/*.csproj"
      - "**/Dockerfile"
      - ".dockerignore"
      - "**/.dockerignore"
      - "compose*.yaml"
      - ".github/workflows/docker.yml"
  pull_request:
    branches: [master]
    paths:
      - "**/*.cs"
      - "**/*.csproj"
      - "**/Dockerfile"
      - ".dockerignore"
      - "**/.dockerignore"
      - "compose*.yaml"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: Validate Compose files
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate production configuration
        run: docker compose -f compose.yaml config --quiet

      - name: Validate debug override
        run: docker compose -f compose.yaml -f compose.debug.yaml config --quiet

  images:
    name: Build ${{ matrix.name }} image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bot
            dockerfile: SosuBot/Dockerfile
          - name: scores-observer
            dockerfile: SosuBot.ScoresObserver/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: sosubot/${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
