global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: sosubot
    static_configs:
      - targets:
          - 127.0.0.1:9091
        labels:
          instance: sosubot

  - job_name: sosubot-scores-observer
    static_configs:
      - targets:
          - 127.0.0.1:9092
        labels:
          instance: sosubot-scores-observer
