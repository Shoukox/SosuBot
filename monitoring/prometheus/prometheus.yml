global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: sosubot
    static_configs:
      - targets:
          - sosubot-service:9090
        labels:
          instance: sosubot

  - job_name: sosubot-scores-observer
    static_configs:
      - targets:
          - scores-observer-service:9090
        labels:
          instance: sosubot-scores-observer
